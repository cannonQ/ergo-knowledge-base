  # ── Multi-Protocol Reference ──────────────────────────────────────────────

  - org: arkadianet
    repo: citadel
    priority: high
    group: reference
    language: [rust, typescript]
    extract: [contracts, readme, docs]
    patterns: [TransactionBuilder, ErgoPay, ergoConnector, OutputBuilder, NodeClient]
    output_dir: content/ecosystem/citadel
    description: >
      Gold mine: one crate per protocol (AMM, Dexy, HodlCoin, Duckpools, Rosen, SigmaFi, SigmaUSD).
      Shows EIP-12 tx building, box selection, sigma encoding, ErgoPay signing flow, node API client
      with capability detection. Single repo demonstrating nearly every major Ergo protocol interaction.
    special: citadel  # Triggers extra per-protocol extraction pass


# ── Cross-cutting patterns ────────────────────────────────────────────────
# These synthetic docs are assembled by aggregating pattern matches ACROSS
# multiple repos above. Generated after all repos are processed.

cross_cutting_patterns:

  - id: eip12-dapp-connector
    output_file: content/patterns/eip12-dapp-connector.md
    source_repos:
      - nautls/nautilus-wallet
      - ThierryM1212/SAFEW
      - fleet-sdk/fleet
    pattern_regex: "ergoConnector|get_utxos|sign_tx|submit_tx|get_change_address"
    description: "EIP-12 dApp Connector — connection API, context API, multi-wallet detection, TypeScript types"

  - id: ergopay-signing
    output_file: content/patterns/ergopay-signing.md
    source_repos:
      - arkadianet/citadel
      - nautls/nautilus-wallet
    pattern_regex: "ErgoPay|ergopay|ergoPayUrl|ErgoPayResponse"
    description: "ErgoPay (EIP-20) — mobile signing, URI scheme, dynamic vs static requests, desktop↔mobile flow"

  - id: ergoauth
    output_file: content/patterns/ergoauth-authentication.md
    source_repos:
      - paideiadao/paideia-app
    pattern_regex: "ErgoAuth|ergoauth|SigmaProp.*verify|proveAddress"
    description: "ErgoAuth (EIP-28) — user authentication via SigmaProp signature, challenge-response flow"

  - id: transaction-building
    output_file: content/patterns/transaction-building.md
    source_repos:
      - fleet-sdk/fleet
      - fleet-sdk/fleet-by-example
      - arkadianet/citadel
      - ergoplatform/ergo-appkit
    pattern_regex: "TransactionBuilder|OutputBuilder|newTxBuilder|buildUnsignedTransaction"
    description: "Transaction building — Fleet SDK + AppKit patterns, box selection, fee handling, token ops"

  - id: offchain-bots
    output_file: content/patterns/offchain-bots.md
    source_repos:
      - spectrum-finance/ergo-dex-backend
      - duckpools-io/duckpools
    pattern_regex: "executeOrder|matchOrders|scanBlocks|submitTransaction|botLoop"
    description: "Off-chain bots — chain scanning → state detection → tx assembly → submission"

  - id: onchain-state-tracking
    output_file: content/patterns/onchain-state-tracking.md
    source_repos:
      - rosen-bridge/scanner
      - paideiadao/paideia-state
      - ergo-pad/danaides
    pattern_regex: "AbstractScanner|scanBoxes|trackBox|extractObservation|indexBlock"
    description: "On-chain state tracking — scanning frameworks, box tracking by token/address, state reconstruction"

  - id: headless-dapp
    output_file: content/patterns/headless-dapp.md
    source_repos:
      - DjedAlliance/Djed-Ergo
    pattern_regex: "HeadlessDApp|headless|protocolState|executeAction"
    description: "Headless dApp pattern — pure protocol logic separated from UI, composable and testable"

  - id: constant-segregation
    output_file: content/patterns/constant-segregation.md
    source_repos:
      - ergoplatform/sigmastate-interpreter
      - fleet-sdk/fleet
    pattern_regex: "substConstants|ConstantSegregation|ErgoTree.*constants"
    description: "Constant segregation — substConstants pattern for contract templates without recompilation"
