  - org: rosen-bridge
    repo: scanner
    priority: high
    group: infrastructure
    language: [typescript]
    extract: [readme]
    patterns: [AbstractScanner, extractObservation, AbstractExtractor]
    output_dir: content/ecosystem/rosen-bridge
    description: "Rosen abstract scanner — address/token extractors, observation extraction pattern"

  # ── EIP-12 Wallets ───────────────────────────────────────────────────────

  - org: nautls
    repo: nautilus-wallet
    priority: high
    group: infrastructure
    language: [typescript, vue]
    extract: [readme]
    patterns: [ergoConnector, get_utxos, sign_tx, submit_tx, get_change_address]
    output_dir: content/ecosystem/nautilus
    description: "Nautilus wallet — EIP-12 dApp connector reference implementation, Ledger integration"

  - org: ThierryM1212
    repo: SAFEW
    priority: medium
    group: infrastructure
    language: [javascript]
    extract: [readme]
    patterns: [ergoConnector, sign_tx, ErgoMixer]
    output_dir: content/ecosystem/safew
    description: "SAFEW — alternative EIP-12 browser wallet, ErgoMixer integration"

  # ── DAO / Governance ─────────────────────────────────────────────────────

  - org: paideiadao
    repo: paideia-contracts
    priority: high
    group: dao
    language: [ergoscript, python]
    extract: [contracts, readme, docs]
    patterns: []
    output_dir: content/ecosystem/paideia/contracts
    description: "Paideia DAO contracts — staking, voting, proposal lifecycle, treasury management, config boxes"

  - org: paideiadao
    repo: paideia-app
    priority: medium
    group: dao
    language: [typescript]
    extract: [readme]
    patterns: [ergoConnector, TransactionBuilder, walletConnect]
    output_dir: content/ecosystem/paideia
    description: "Paideia frontend — full Next.js dApp with wallet connection, proposal UI, staking"

  - org: paideiadao
    repo: paideia-state
    priority: medium
    group: dao
    language: [scala]
    extract: [readme]
    patterns: [scanBoxes, trackBox, stateTransition]
    output_dir: content/ecosystem/paideia
    description: "Paideia on-chain state tracking — box scanning, state reconstruction"

  - org: paideiadao
    repo: paideia-offchain
    priority: medium
    group: dao
    language: [python]
    extract: [readme]
    patterns: [buildTransaction, submitTransaction, botOperation]
    output_dir: content/ecosystem/paideia
    description: "Paideia off-chain logic — transaction assembly, bot operations in Python"

  # ── Analytics / Indexing ─────────────────────────────────────────────────

  - org: ergo-pad
    repo: danaides
    priority: high
    group: analytics
    language: [python]
    extract: [readme, docs]
    patterns: [indexBlock, extractBoxes, processTransaction]
    output_dir: content/ecosystem/danaides
    description: "Danaides blockchain indexer — high-performance UTXO indexing, dApp backend patterns"

  - org: ergo-pad
    repo: nft-market
    priority: medium
    group: analytics
    language: [typescript]
    extract: [readme]
    patterns: [ergoConnector, mintNFT, listNFT]
    output_dir: content/ecosystem/skyharbor
