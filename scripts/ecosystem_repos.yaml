# Ecosystem Repository Catalog
# Used by: scripts/clone_and_process_repos.py
# Sourced from: Section 8 of ergo-knowledge-base-plan.md
#
# Fields:
#   org/repo    — GitHub org and repo name (cloned as github.com/{org}/{repo})
#   priority    — high | medium | low (controls processing order and inclusion)
#   group       — core-protocol | sdk | defi | infrastructure | dao | analytics | reference
#   language    — list of primary languages (for file-type targeting)
#   extract     — what to pull: contracts (.es/.ergo), patterns (regex match), readme, docs, swagger
#   patterns    — regex keywords to find in non-ErgoScript code (tx building, EIP-12, etc.)
#   output_dir  — relative path under EKB root where generated docs go
#   description — one-line summary fed into LLM context
#   special     — optional: "citadel" triggers per-protocol extraction pass
#
# NOTE: Verify org names against GitHub before running — some may have renamed.
# Run with: python3 scripts/clone_and_process_repos.py --dry-run

repos:

  # ── Core Protocol ────────────────────────────────────────────────────────

  - org: ergoplatform
    repo: ergo
    priority: high
    group: core-protocol
    language: [scala]
    extract: [swagger, readme]
    patterns: []
    output_dir: content/reference/node-api
    description: "Ergo node — REST API endpoints (Swagger), config options, mining parameters"

  - org: ergoplatform
    repo: sigmastate-interpreter
    priority: high
    group: core-protocol
    language: [scala]
    extract: [contracts, readme, docs]
    patterns: []
    output_dir: content/reference/ergoscript
    description: "ErgoScript compiler internals, ErgoTree spec, test cases as usage examples"

  - org: ergoplatform
    repo: sigma-rust
    priority: high
    group: core-protocol
    language: [rust]
    extract: [readme, docs]
    patterns: []
    output_dir: content/sdks/sigma-rust
    description: "Rust sigma-state implementation — WASM bindings, wallet features, ErgoTree interpreter"

  - org: ergoplatform
    repo: eips
    priority: high
    group: core-protocol
    language: [markdown]
    extract: [docs, readme]
    patterns: []
    output_dir: content/reference/eips
    description: "All Ergo Improvement Proposals as structured reference docs"

  - org: ergoplatform
    repo: oracle-core
    priority: high
    group: core-protocol
    language: [rust]
    extract: [contracts, readme, docs]
    patterns: [OraclePool, postDataPoint, updatePool]
    output_dir: content/ecosystem/oracle-pools
    description: "Oracle pool v2 architecture, connector patterns, data posting"

  - org: ergoplatform
    repo: ergo-appkit
    priority: high
    group: sdk
    language: [java, scala]
    extract: [readme, docs]
    patterns: [newTxBuilder, outBoxBuilder, buildUnsignedTransaction, ErgoProver, ErgoClient]
    output_dir: content/sdks/appkit
    description: "JVM SDK — transaction building, contract compilation, wallet interaction"

  # ── Fleet SDK ────────────────────────────────────────────────────────────

  - org: fleet-sdk
    repo: fleet
    priority: high
    group: sdk
    language: [typescript]
    extract: [readme, docs]
    patterns: [TransactionBuilder, OutputBuilder, ErgoAddress, RECOMMENDED_MIN_FEE_VALUE, SLong, SByte]
    output_dir: content/sdks/fleet-sdk
    description: "Fleet SDK core — TypeScript transaction builder, wallet integration, serialization"

  - org: fleet-sdk
    repo: fleet-by-example
    priority: high
    group: sdk
    language: [typescript]
    extract: [contracts, readme]
    patterns: [TransactionBuilder, OutputBuilder, mintToken, burnToken]
    output_dir: examples/fleet-sdk
    description: "Fleet SDK worked examples — direct cookbook material for token minting, tx building"

  - org: fleet-sdk
    repo: docs
    priority: high
    group: sdk
    language: [markdown]
    extract: [docs, readme]
    patterns: []
    output_dir: content/sdks/fleet-sdk
    description: "Fleet SDK VitePress documentation — migrate and cross-reference"

  # ── Python SDKs ──────────────────────────────────────────────────────────

  - org: ergo-pad
    repo: ergo-python-appkit
    priority: medium
    group: sdk
    language: [python]
    extract: [readme, docs]
    patterns: [ErgoAppKit, buildUnsignedTransaction, signTransaction]
    output_dir: content/sdks/python
    description: "Python AppKit wrapper (ergpy) — JPype bridge, transaction building patterns"

  # ── Wallets ──────────────────────────────────────────────────────────────

  - org: ergoplatform
    repo: ergo-wallet-app
    priority: medium
    group: infrastructure
    language: [kotlin]
    extract: [readme]
    patterns: []
    output_dir: content/ecosystem/ergo-wallet
    description: "Official Ergo Android/iOS wallet — key management, mobile wallet patterns"

  - org: ergoplatform
    repo: ledger-app-ergo
    priority: low
    group: infrastructure
    language: [c]
    extract: [readme, docs]
    patterns: []
    output_dir: content/ecosystem/ledger
    description: "Ledger hardware wallet integration for Ergo"

  # ── DEX / Spectrum ───────────────────────────────────────────────────────

  - org: spectrum-finance
    repo: ergo-dex
    priority: high
    group: defi
    language: [ergoscript, scala]
    extract: [contracts, readme]
    patterns: []
    output_dir: content/ecosystem/spectrum-dex/contracts
    description: "Spectrum DEX (formerly ErgoDEX) — AMM pools, order-book, atomic swaps, LP mechanics"

  - org: spectrum-finance
    repo: ergo-dex-backend
    priority: high
    group: defi
    language: [scala]
    extract: [readme]
    patterns: [executeOrder, matchOrders, poolState, submitTransaction]
    output_dir: content/ecosystem/spectrum-dex
    description: "Spectrum off-chain execution bots — order matching, state tracking"

  # ── Stablecoins ──────────────────────────────────────────────────────────

  - org: kushti
    repo: dexy-stable
    priority: high
    group: defi
    language: [ergoscript, scala]
    extract: [contracts, readme, docs]
    patterns: []
    output_dir: content/ecosystem/dexy
    description: "Dexy stablecoin — oracle-pegged minting, LP, cross-tracker, anti-drain mechanisms"

  - org: DjedAlliance
    repo: Djed-Ergo
    priority: high
    group: defi
    language: [ergoscript, scala]
    extract: [contracts, readme]
    patterns: [HeadlessDApp, mintSigUSD, redeemSigUSD, mintSigRSV]
    output_dir: content/ecosystem/sigmausd
    description: "SigmaUSD / AgeUSD — stablecoin protocol, headless dApp pattern, reserve management"

  # ── Lending / Options ────────────────────────────────────────────────────

  - org: duckpools-io
    repo: duckpools
    priority: high
    group: defi
    language: [ergoscript]
    extract: [contracts, readme]
    patterns: []
    output_dir: content/ecosystem/duckpools
    description: "Duckpools — lending pools, collateralized borrowing, interest rate algorithms, liquidation"

  # ── Proof-of-Hodl ────────────────────────────────────────────────────────

  - org: PhoenixErgo
    repo: phoenix-hodlcoin-contracts
    priority: medium
    group: defi
    language: [ergoscript]
    extract: [contracts, readme]
    patterns: []
    output_dir: content/ecosystem/phoenix-hodlcoin
    description: "HodlCoin / Phoenix — proof-of-hodl mechanics, time-locked value accrual"

  # ── Rosen Bridge ─────────────────────────────────────────────────────────

  - org: rosen-bridge
    repo: contract
    priority: high
    group: infrastructure
    language: [ergoscript]
    extract: [contracts, readme, docs]
    patterns: []
    output_dir: content/ecosystem/rosen-bridge/contracts
    description: "Rosen Bridge contracts — guard/watcher architecture, multi-sig consensus, RWT staking, fraud detection"

  - org: rosen-bridge
    repo: watcher
    priority: high
    group: infrastructure
    language: [typescript]
    extract: [readme]
    patterns: [createCommitment, triggerEvent, observationExtractor]
    output_dir: content/ecosystem/rosen-bridge
