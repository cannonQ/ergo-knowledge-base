# -----------------------------------------------------------------------------
# Privacy
# -----------------------------------------------------------------------------

  - term: ErgoMixer
    aliases:
      - ergo mixer
      - ergomixer
    definition: >
      State-of-the-art non-interactive and non-custodial token mixer on Ergo.
      The first working non-custodial, non-interactive mixer in cryptocurrency.
      Built on the ZeroJoin mixing scheme using Sigma protocols (ring
      signatures and Diffie-Hellman tuple proofs). Supports Tor (v3.0.0+),
      covert addresses, and stealth addresses. Works with ERG and native
      tokens.
    category: privacy
    docs_url: https://docs.ergoplatform.com/uses/mixer/

  - term: ZeroJoin
    aliases:
      - zero join
      - zerojoin
      - ergo mixing protocol
    definition: >
      Ergo's foundational coin-mixing scheme underlying ErgoMixer. Based on
      ring signatures and proof of knowledge for a Diffie-Hellman tuple.
      Non-interactive — works with the blockchain alone, no off-chain
      coordination between participants needed. Restores fungibility of
      mixed coins.
    category: privacy

  - term: Stealth Addresses
    aliases:
      - stealth address
      - one-time addresses
    definition: >
      Privacy technique generating a unique, unlinkable address for each
      payment to the same recipient. Derived from the recipient's public key
      so only they can detect and spend funds, but a blockchain observer
      cannot link payments to the same recipient. Defined in EIP-41.
      Implemented in ErgoMixer.
    category: privacy

  - term: Covert Addresses
    aliases:
      - covert address
      - ergomixer covert
    definition: >
      Privacy feature in ErgoMixer allowing users to designate a receive
      address that functions as a drop box — funds sent to this address
      are automatically routed through the mixer, breaking the link between
      sender and receiver without the sender knowing mixing is occurring.
    category: privacy

  - term: Sigmajoin
    aliases:
      - sigma join
      - ergo coinjoin
      - coinjoin ergo
    definition: >
      CoinJoin protocol specification for Ergo. Defines how multiple parties
      can combine transactions into a single transaction to obscure the link
      between inputs and outputs. Related to but distinct from ErgoMixer's
      non-interactive ZeroJoin scheme.
    category: privacy


