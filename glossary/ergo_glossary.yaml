# =============================================================================
# Ergo Glossary — Combined Reference
# Sources: hand-curated glossary + ErgoDocs AI chat vocabulary sheets
# =============================================================================
terms:

# -----------------------------------------------------------------------------
# Core Protocol — Ledger & State Model
# -----------------------------------------------------------------------------

  - term: eUTXO
    aliases:
      - extended UTXO
      - extended utxo model
      - eutxo
      - eUTXO model
      - extended unspent transaction output
    definition: >
      Ergo's extended UTXO model. Each UTXO (called a "box") carries not just
      value but also arbitrary typed data in registers (R0-R9) and a guarding
      script (ErgoTree). Enables expressive smart contracts while preserving
      the deterministic, parallel-friendly properties of UTXO. Foundation for
      all Ergo smart contracts and dApps.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/eutxo/

  - term: Box
    aliases:
      - boxes
      - ergo box
      - utxo box
      - UTXO
      - unspent box
    definition: >
      Ergo's term for UTXOs. A box contains: a monetary value in nanoErgs,
      an optional set of tokens, registers R0-R9 for arbitrary typed data,
      a guarding proposition (ErgoTree), creation height, and a unique box ID
      derived from the creating transaction. The "unit of state" for all
      contracts, users, and tokens on Ergo.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/data-model/box/

  - term: Registers
    aliases:
      - register
      - R0
      - R1
      - R2
      - R3
      - R4
      - R5
      - R6
      - R7
      - R8
      - R9
    definition: >
      Typed data fields R0-R9 attached to each box. R0 (value in nanoErgs),
      R1 (guarding script), R2 (tokens), and R3 (creation info) are mandatory
      and set automatically. R4-R9 are optional and can hold any SType value,
      used extensively by smart contracts to store state, parameters,
      oracle values, and identifiers.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/data-model/box/registers/

  - term: Transaction
    aliases:
      - tx
      - ergo transaction
      - transactions
    definition: >
      An atomic state transition on the Ergo blockchain: consumes input boxes
      and produces output boxes. Every spending condition (guarding script) for
      each input must be satisfied. The only way state changes on-chain.
      All "contract execution" happens by spending boxes — there is no
      background process or global contract storage.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/transactions/

  - term: Data input
    aliases:
      - data inputs
      - read-only input
      - read-only inputs
    definition: >
      Boxes referenced by a transaction for their data but not spent.
      Their guarding script is NOT executed. Used extensively for oracle
      data feeds — the oracle box is read but not consumed, enabling
      many transactions to reference the same oracle data simultaneously.
      Key enabler for oracle pools, shared configuration boxes, and
      shared state without contention.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/tx/read-only-inputs/

  - term: ErgoTree
    aliases:
      - ergo tree
      - ergotree
      - guarding script
      - guarding proposition
      - proposition bytes
      - spending predicate
      - spending condition
    definition: >
      The low-level serialized representation of an ErgoScript contract.
      ErgoTree is a typed abstract syntax tree that gets serialized and stored
      in each box's R1 register. Supports constant segregation for efficient
      template-based contract reuse. When nodes validate transactions, they
      evaluate ErgoTree directly.
    category: development
    docs_url: https://docs.ergoplatform.com/dev/scs/ergotree/

  - term: ErgoScript
    aliases:
      - ergo script
      - ergoscript
      - ergo scripting language
    definition: >
      Ergo's smart contract language, syntactically similar to Scala but
      simplified. Statically typed with local type inference, supports
      first-class lambdas, high-order collection operations, and compiles
      to ErgoTree. Call-by-value evaluation. Primary way developers express
      contract logic; designed to be predictable and safe in a UTXO setting.
    category: development
    docs_url: https://docs.ergoplatform.com/dev/scs/ergoscript/

  - term: ErgoScript context
    aliases:
      - SELF
      - INPUTS
      - OUTPUTS
      - HEIGHT
      - script context
      - blockchain context
    definition: >
      The data a script can access when it is evaluated: SELF (the box being
      spent), INPUTS (array of all consumed boxes), OUTPUTS (array of created
      boxes), HEIGHT (current block height). Keeps ErgoScript deterministic —
      contracts validate against the transaction and blockchain context
      without arbitrary external calls.
    category: development
    docs_url: https://docs.ergoplatform.com/dev/scs/ergoscript/ergoscript-key-concepts/

  - term: Context extension
    aliases:
      - context variables
      - context variable
      - context ext
      - getVar
    definition: >
      Additional data passed to a script during transaction validation,
      accessed via getVar[T](id) in ErgoScript. Enables parameterizing
      contract execution without storing data in the box itself. Common
      pattern for passing proofs, indices, and configuration to contracts.
    category: development

  - term: Sigma protocols
    aliases:
      - sigma protocol
      - Σ-protocols
      - sigma proofs
      - sigma propositions
      - sigma prop
      - SigmaProp
    definition: >
      Zero-knowledge proof protocols at the heart of Ergo's cryptographic
      operations. Enable proving knowledge of discrete logarithms (proveDlog)
      and Diffie-Hellman tuples (proveDHTuple) without revealing secrets.
      Every ErgoScript contract ultimately evaluates to a SigmaProp.
      Composable via AND/OR logic for expressive multisig and authorization.
    category: cryptography
    docs_url: https://docs.ergoplatform.com/dev/scs/sigma/

  - term: Ring signatures
    aliases:
      - ring signature
      - threshold signatures
      - threshold sig
      - multisig
      - k-of-n
      - atLeast
    definition: >
      Cryptographic patterns for proving "one of these keys signed" (ring)
      or "m-of-n signed" (threshold). In ErgoScript, threshold authorization
      is expressed via atLeast(k, Coll(pk1, pk2, ...)) combining SigmaProps.
      Used in multisig custody, DAOs, mixers, and advanced access control.
    category: cryptography
    docs_url: https://docs.ergoplatform.com/dev/protocol/zkp/

  - term: NiPoPoW
    aliases:
      - nipopow
      - nipopows
      - non-interactive proofs of proof of work
      - NiPoPoWs
      - light client proofs
    definition: >
      Non-Interactive Proofs of Proof-of-Work. Compact cryptographic proofs
      that enable super-light clients to verify blockchain state without
      downloading the full chain. Enable sidechains and cross-chain
      verification. A foundational feature of Ergo's interoperability story.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/nipopows/

  - term: AVL tree
    aliases:
      - avl+ tree
      - avl trees
      - authenticated data structure
      - authenticated dictionary
      - AvlTree
    definition: >
      Authenticated data structure used for Ergo's state representation.
      Enables compact proofs of inclusion/exclusion for state elements.
      The AvlTree type in ErgoScript represents a digest of such a tree
      and can verify proofs of operations (inserts, lookups, removals).
      Ergo commits to the UTXO set using an AVL+ tree with a digest
      in block headers.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/avl/

  - term: Native tokens
    aliases:
      - first-class assets
      - ergo tokens
      - native assets
      - token
      - tokens
    definition: >
      Tokens are supported at the protocol level on Ergo and live in R2 of
      boxes as (tokenId, amount) pairs. No separate "token contract" is needed.
      Many dApps — DEXes, stablecoins, NFTs, DAOs — are built from native
      tokens plus scripts. A token type is created once per minting transaction;
      its ID is derived from the first input box ID.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/data-model/box/tokens/

  - term: Token ID rule
    aliases:
      - token minting rule
      - nft minting
      - token id
      - minting transaction
      - token emission
    definition: >
      A transaction can mint at most one new token type; the token ID is
      derived from the first input box ID of the minting transaction. An NFT
      is typically a token with supply 1. Widely used to uniquely identify
      boxes (state boxes, pool boxes, config boxes) and to anchor "singleton"
      state in eUTXO designs.
    category: protocol

  - term: Storage rent
    aliases:
      - demurrage
      - storage fee
      - storage rent fee
      - box rent
    definition: >
      A fee mechanism charging for long-term UTXO storage on the blockchain,
      unique to Ergo among major chains. After 4 years without being spent,
      a box can be garbage-collected by miners. Prevents state bloat and
      ensures long-term economic sustainability without relying solely
      on transaction fees. Protocols creating long-lived boxes must plan
      for periodic box refresh.
    category: protocol
    docs_url: https://docs.ergoplatform.com/mining/rent/

  - term: Atomic swaps
    aliases:
      - atomic swap
      - cross-chain swap
      - trustless swap
    definition: >
      Trustless exchange patterns enabled by UTXO-style scripting where two
      parties swap assets without a trusted intermediary. A classic UTXO
      advantage; also a building block for cross-chain and DEX-like designs.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/eutxo/atomic/

  - term: Minimum transaction fee
    aliases:
      - tx fee
      - transaction fee
      - miner fee
      - min fee
    definition: >
      Ergo has a protocol minimum fee (commonly 0.001 ERG). Fees are
      predictable compared to gas-style systems; dApps often design
      flows around fixed fee assumptions. The fee is taken from ERG
      in the miner fee output box.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/tx/min-fee/

  - term: Minimum box value
    aliases:
      - min box value
      - dust threshold
      - box minimum erg
      - min erg per box
    definition: >
      A box must contain at least a minimum amount of ERG to exist,
      scaled to its data size (registers + tokens). A major design
      constraint for token-heavy apps: every token-holding box must also
      carry enough ERG. Failure to account for this causes transaction
      construction errors.
    category: protocol
    docs_url: https://docs.ergoplatform.com/dev/protocol/tx/min-box-value/

  - term: Scorex
    aliases:
      - scorex framework
      - scorex modular framework
    definition: >
      Modular blockchain framework that Ergo's reference node implementation
      is built upon. Provides the networking, consensus, and transaction
      handling layers. Written in Scala.
    category: protocol

  - term: Sub-blocks
    aliases:
      - sub-block
      - subblocks
      - sub block
      - microblocks
    definition: >
      A proposed protocol enhancement to increase effective throughput by
      producing intermediate blocks between full blocks. Under active
      discussion and development as of 2024-2025.
    category: protocol

  - term: EIP
    aliases:
      - ergo improvement proposal
      - ergo improvement proposals
      - EIPs
    definition: >
      Ergo Improvement Proposal. Formal process for proposing protocol
      changes, new standards, and ecosystem conventions. Managed via
      the ergoplatform/eips GitHub repository.
    category: governance

  - term: Soft fork
    aliases:
      - soft-fork
      - softfork
      - protocol upgrade
      - 6.0 soft fork
      - EIP-50
    definition: >
      A backward-compatible protocol upgrade activated by miner voting.
      The 6.0 soft fork (EIP-50) introduced new ErgoTree v3 features
      including UnsignedBigInt, higher-order lambdas, and new methods.
    category: protocol


# -----------------------------------------------------------------------------
# Mining & Monetary Mechanics
# -----------------------------------------------------------------------------

  - term: Autolykos
    aliases:
      - autolykos2
      - autolykos v2
      - autolykos algorithm
      - ergo mining algorithm
    definition: >
      Ergo's memory-hard proof-of-work mining algorithm. Autolykos v2
      (activated at block 417,792) removed the non-outsourceability property
      of v1, enabling mining pools. Designed to be GPU-friendly and
      ASIC-resistant through memory-hardness.
    category: mining
    docs_url: https://docs.ergoplatform.com/mining/autolykos/

  - term: Difficulty adjustment
    aliases:
      - difficulty
      - mining difficulty
      - hashrate adjustment
    definition: >
      The mechanism that adjusts mining difficulty to target approximately
      2-minute block intervals. Stabilizes block production and network
      operation under changing hash rate.
    category: mining
    docs_url: https://docs.ergoplatform.com/mining/difficulty/

  - term: Emission schedule
    aliases:
      - monetary emission
      - block reward
      - ergo emission
      - EIP-27
      - tail emission
      - emission curve
      - re-emission
    definition: >
      How new ERG enters circulation via block rewards. Central to long-term
      economics and miner incentives. EIP-27 (the re-emission proposal)
      modified the emission curve to introduce a tail emission period,
      extending miner rewards beyond the initial schedule.
    category: mining
    docs_url: https://docs.ergoplatform.com/mining/emission/


# -----------------------------------------------------------------------------
# Design Patterns
# -----------------------------------------------------------------------------

  - term: Multi-stage contracts
    aliases:
      - multi-stage transactions
      - transaction chaining
      - staged contracts
      - chained transactions
      - multi-stage protocol
    definition: >
      A design pattern where complex behavior is achieved by chaining
      transactions and evolving boxes across stages. Each stage is a separate
      transaction that validates the correct state transition. Supports
      sophisticated applications without global mutable storage. The Ergo
      approach to complex on-chain logic that would require loops or recursion
      in account-based chains.
    category: pattern
    docs_url: https://docs.ergoplatform.com/dev/scs/multi/

  - term: Singleton / State NFT
    aliases:
      - state nft
      - singleton nft
      - singleton token
      - state token
      - pool nft
      - protocol nft
      - identity token
      - canonical state box
    definition: >
      A common eUTXO design pattern where a unique token (supply=1) marks the
      canonical state box for a protocol (pool state, DAO state, config state).
      When the state box is spent and recreated, the singleton token passes
      through, giving a stable identity to "the one true box" even though boxes
      are immutable and replaced each update.
    category: pattern

  - term: State machine
    aliases:
      - box state machine
      - state transition
      - box lifecycle
      - box replacement
      - state box
      - dapp state as boxes
    definition: >
      The core "stateful application" approach on Ergo: a contract enforces
      that when a state box is spent, a new output box is created with the
      same state NFT, updated registers, and a script that preserves
      invariants. dApp "state" evolves through spend-and-recreate cycles,
      not mutable storage updates.
    category: pattern

  - term: Headless dApp
    aliases:
      - headless dapp
      - headless dApp pattern
    definition: >
      Design pattern separating protocol logic (state reading + action
      execution) from UI into a pure, portable layer. Enables multiple
      frontends (web, desktop, CLI, bots) to share the same interaction
      code. Pioneered by the AgeUSD/Djed-Ergo implementation.
    category: pattern

  - term: Off-chain bot
    aliases:
      - execution bot
      - offchain bot
      - off-chain execution
      - DEX bot
      - chained transaction bot
    definition: >
      Software that monitors on-chain state and submits transactions to
      advance protocol state. Used by Spectrum DEX (order matching),
      Rosen Bridge (watcher/guard), and Machina Finance. Architecture:
      scan chain → detect actionable state → build tx → submit.
      Earns execution fees.
    category: pattern

  - term: Constant segregation
    aliases:
      - segregated constants
      - constant substitution
      - substConstants
    definition: >
      ErgoTree feature where constants are stored separately from the
      script logic. Enables using serialized scripts as templates where
      specific constants can be swapped (via substConstants) without
      recompiling. Key pattern for contract reuse across dApps.
    category: development

  - term: Invariant
    aliases:
      - contract invariant
      - protocol invariant
      - on-chain invariant
    definition: >
      A rule that must always hold in a smart contract (e.g., pool accounting,
      token conservation, reserve ratios). DeFi safety on Ergo is essentially
      "invariants enforced by scripts." Common invariants: state NFT continuity,
      script continuity, token conservation, reserve balance correctness,
      fee correctness, minimum box value preservation.
    category: pattern


# -----------------------------------------------------------------------------
# DeFi Protocols
# -----------------------------------------------------------------------------

  - term: SigmaUSD
    aliases:
      - sigma usd
      - sigmausd
      - sigusd
      - SigRSV
      - sigrsv
      - sigma reserve
      - AgeUSD
      - ageusd
      - age usd
    definition: >
      Ergo's first algorithmic stablecoin implementing the AgeUSD protocol.
      Pegged to USD via an over-collateralized reserve of ERG. Two token
      types: SigUSD (stablecoin) and SigRSV (reserve coin absorbing
      volatility). Maintained peg through the 2022-2023 bear market.
    category: defi
    docs_url: https://docs.ergoplatform.com/uses/sigmausd/

  - term: Dexy
    aliases:
      - dexy stablecoin
      - dexy usd
      - dexyusd
      - dexy gold
      - dexygold
      - dexy protocol
    definition: >
      Oracle-pegged stablecoin protocol designed by kushti and scalahub.
      Uses one-way minting via emission contract + Uniswap V2-style LP
      with oracle rate modifications. Features anti-drain mechanisms,
      cross-tracker for LP rate monitoring, and top-up swaps. Deployed
      as DexyGold (gold-pegged) and DexyUSD.
    category: defi

  - term: GORT
    aliases:
      - gort token
      - gold oracle reward token
    definition: >
      Gold Oracle Reward Token. Rewards oracle operators in the gold oracle
      pool used by Dexy and SigGold. 0.2% of protocol fees buy back GORTs
      from the GORT/ERG LP and return them to the oracle pool contract.
    category: token

  - term: Spectrum
    aliases:
      - spectrum dex
      - spectrum finance
      - ergodex
      - ergo dex
      - ErgoDEX
    definition: >
      Decentralized exchange on Ergo (formerly ErgoDEX). Offers AMM
      liquidity pools with Uniswap V2-style constant product formula,
      atomic swaps, and partial order fills. Off-chain execution bots
      match and execute orders; on-chain scripts validate all transitions.
    category: defi
    docs_url: https://docs.ergoplatform.com/uses/dex/

  - term: AMM
    aliases:
      - automated market maker
      - constant product amm
      - liquidity pool
      - pool reserves
      - amm pool
      - dex pool
      - swap pool
    definition: >
      Automated Market Maker — on-chain swap mechanism using a pool's reserves
      and a pricing function (e.g., constant product x*y=k). On Ergo, AMM
      pools are represented as boxes containing reserves + parameters (often
      with a state NFT). Off-chain bots or users submit transactions that
      update the pool box according to the pricing formula.
    category: defi

  - term: LP tokens
    aliases:
      - liquidity provider tokens
      - lp token
      - pool share token
      - liquidity tokens
    definition: >
      Tokens representing a proportional share of liquidity in an AMM pool.
      Minted when liquidity is deposited, burned when withdrawn in exchange
      for underlying reserves plus accrued fees.
    category: defi

  - term: Slippage
    aliases:
      - price slippage
      - min output
      - slippage tolerance
    definition: >
      The difference between expected and executed price in a DEX trade,
      due to pool curve mechanics and trade size. Users set slippage limits;
      contracts enforce min-output constraints to protect against excessive
      slippage and MEV.
    category: defi

  - term: Duckpools
    aliases:
      - duckpools
      - duck pools
      - duckpools lending
      - duckpools protocol
    definition: >
      Pool-based lending and collateralized borrowing protocol on Ergo.
      Features algorithmic interest rates, permissionless lending pools,
      native asset collateral, and option pools. First protocol on Ergo
      to allow native assets as loan collateral and enable long/short
      positions on ERG.
    category: defi

  - term: SigmaFi
    aliases:
      - sigma fi
      - sigmafi
      - sigma finance
    definition: >
      DeFi platform offering P2P bond contracts and yield generation
      strategies on Ergo. Users can create and trade bonds with
      configurable terms.
    category: defi

  - term: SigmaO
    aliases:
      - sigma options
      - sigmao
      - sigma o
    definition: >
      Decentralized options trading platform on Ergo. Enables creating
      and trading option contracts on Ergo native tokens via ErgoScript
      smart contracts.
    category: defi
    docs_url: https://docs.ergoplatform.com/uses/deriv/

  - term: Phoenix Finance
    aliases:
      - phoenix
      - hodlcoin
      - hodl coin
      - hodlerg
      - hodlERG
      - proof of hodl
    definition: >
      DeFi platform implementing the HodlCoin concept — a proof-of-hodl
      mechanism where value accrues to long-term holders through a
      time-locked, monotonically-increasing floor price backed by ERG
      reserves in the contract.
    category: defi

  - term: Gluon
    aliases:
      - gluon protocol
      - gluon stablecoin
    definition: >
      Stablecoin infrastructure protocol aiming to bring Djed-style
      cross-chain stablecoins to Ergo. Designed by Dr. Bruno Woltzenlogel
      Paleo. Initial deployments pegged to gold, thus using the gold
      oracle pool.
    category: defi

  - term: EXLE
    aliases:
      - ergolend
      - exle
      - ergo lend
    definition: >
      Decentralized lending and borrowing protocol integrated with
      Crux Finance for portfolio tracking. Explores how traditional
      lending primitives can be adapted to the eUTXO architecture.
    category: defi

  - term: ChainCash
    aliases:
      - chaincash
      - chain cash
    definition: >
      Framework for creating decentralized, note-based monetary systems
      on UTXO blockchains. Records reserves and signatures for each
      note on Ergo. Developed by kushti.
    category: defi

  - term: Mew Finance
    aliases:
      - mew
      - mew dex
      - mewfinance
    definition: >
      DeFi suite including a DEX, NFT marketplace, and other financial
      tools on Ergo.
    category: defi

  - term: Collateral
    aliases:
      - overcollateralization
      - collateral ratio
      - collateralized
      - liquidation ratio
    definition: >
      Assets locked to back a loan, stable asset, or position in a DeFi
      protocol. Overcollateralization means the collateral value exceeds
      the issued stable value, providing a safety buffer. The collateral
      ratio defines when a position becomes eligible for liquidation.
      Common risk control in crypto-backed stablecoin and lending designs.
    category: defi

  - term: Liquidation
    aliases:
      - liquidate
      - forced liquidation
      - undercollateralized
      - borrow position
    definition: >
      Forced closing of an undercollateralized borrow position to protect
      a lending protocol's solvency. Implemented as a valid spend path in
      the position script — when the collateral ratio falls below the
      threshold, anyone can submit the liquidation transaction and receive
      a liquidation incentive.
    category: defi

  - term: MEV
    aliases:
      - miner extractable value
      - maximal extractable value
      - frontrunning
    definition: >
      Value extractable by manipulating transaction ordering — including
      frontrunning, sandwich attacks, and arbitrage. Relevant to DEX
      execution design on Ergo; off-chain bots and slippage protection
      are common mitigations.
    category: defi


# -----------------------------------------------------------------------------
# Infrastructure & Bridges
# -----------------------------------------------------------------------------

  - term: Rosen Bridge
    aliases:
      - rosen
      - rosen bridge
      - RSN
      - rsn token
      - rosen token
    definition: >
      Ergo-centric cross-chain bridge using a two-layer watcher/guard
      architecture. All consensus logic runs on Ergo smart contracts,
      making the bridge auditable on a single chain. Guards hold keys
      for multi-sig wallets on other chains; watchers monitor and report
      events. Adding new chains requires only creating a wallet and
      watchers — no new smart contracts on the target chain.
    category: infrastructure

  - term: RWT
    aliases:
      - rwt token
      - rosen watcher token
      - X-RWT
    definition: >
      Rosen Watcher Token. Chain-specific permit tokens (e.g., BTC-RWT,
      ADA-RWT) that authorize watchers to report events on specific
      chains. Acquired by staking RSN tokens. Can be slashed for
      fraudulent event reports.
    category: token

  - term: Oracle pools
    aliases:
      - oracle pool
      - ergo oracles
      - oracle pool v2
      - oracle pool 2.0
    definition: >
      Decentralized oracle framework for bringing external data on-chain.
      Time is divided into epochs; at each epoch end, oracles reach
      consensus on a data point and deliver it to a box readable as a
      data input by any transaction. V2 rewards oracles with custom
      tokens (e.g., GORT for the gold oracle).
    category: infrastructure
    docs_url: https://docs.ergoplatform.com/uses/oracles/

  - term: Full node
    aliases:
      - ergo node
      - ergo full node
      - reference node
      - node
    definition: >
      A node that downloads and validates all blocks and transactions,
      maintaining the full UTXO set. Full nodes enforce all consensus
      rules independently and verify scripts, token rules, and PoW.
      Also exposes the node REST API for dApp backends.
    category: infrastructure
    docs_url: https://docs.ergoplatform.com/node/

  - term: Mempool
    aliases:
      - transaction pool
      - unconfirmed transactions
      - pending transactions
    definition: >
      The set of valid, unconfirmed transactions a node holds before
      they are mined. Mempool behavior affects dApp and wallet UX:
      transaction chaining (spending unconfirmed outputs), fee bumping,
      and double-spend attempts all interact with the mempool.
    category: infrastructure
    docs_url: https://docs.ergoplatform.com/node/mempool/

  - term: Nautilus
    aliases:
      - nautilus wallet
      - nautilus
    definition: >
      Community-driven browser extension wallet for Ergo. Implements
      EIP-12 dApp connector, ErgoPay support, Ledger integration,
      multi-wallet management, and sandboxed NFT gallery. The de facto
      standard wallet for Ergo dApp interaction. Built by arobsn.
    category: tool

  - term: SAFEW
    aliases:
      - safew
      - simple and fast ergo wallet
    definition: >
      Alternative browser extension wallet for Ergo implementing EIP-12
      dApp connector. Features chained transactions, ErgoMixer
      integration, ErgoPay wallet support, and covert address management.
