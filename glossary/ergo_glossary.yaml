# -----------------------------------------------------------------------------
# Node Modes & Operation
# -----------------------------------------------------------------------------

  - term: Node modes
    aliases:
      - archival full node
      - pruned full node
      - digest node
      - stateless node
      - node configuration
    definition: >
      Ergo nodes support four operational modes: Archival Full Node (complete
      history, stateType=utxo, blocksToKeep=-1), Pruned Full Node (full
      security, keeps only recent blocks), Digest Node (stateless, uses
      authenticated UTXO digests, minimal storage), and Light SPV Client
      (header validation only, relies on full nodes for state queries).
    category: node
    docs_url: https://docs.ergoplatform.com/node/modes/

  - term: SPV
    aliases:
      - simplified payment verification
      - light client
      - light node
      - light SPV
      - spv client
    definition: >
      Simplified Payment Verification — verifying transactions using only
      block headers rather than the full blockchain. Ergo's Light SPV Client
      mode offers minimal resource usage. Ergo's NiPoPoWs strengthen SPV
      security beyond traditional Bitcoin-style SPV implementations.
    category: node

  - term: Bootstrapping
    aliases:
      - utxoBootstrap
      - nipopowBootstrap
      - utxo snapshot sync
      - fast sync
    definition: >
      Techniques for accelerating initial node synchronization. utxoBootstrap
      downloads a compressed UTXO set snapshot to avoid replaying full chain
      history. nipopowBootstrap uses NiPoPoW proofs to skip most block
      processing. Both dramatically reduce sync time at the cost of some
      additional trust assumptions during setup.
    category: node

  - term: UTXO Set Snapshot
    aliases:
      - utxo snapshot
      - state snapshot
      - compressed utxo set
    definition: >
      A compressed representation of all unspent transaction outputs at a
      specific block height. Used by bootstrapping nodes to skip full chain
      replay. Authenticated via the AVL+ tree digest in block headers,
      allowing cryptographic verification of snapshot integrity.
    category: node


