# -----------------------------------------------------------------------------
# Standards & EIPs
# -----------------------------------------------------------------------------

  - term: EIP-12
    aliases:
      - eip12
      - EIP-0012
      - dapp connector
      - dApp connector
      - dApp connector protocol
      - dapp-wallet web bridge
      - web bridge
    definition: >
      dApp-Wallet web bridge standard for browser extension wallets.
      Defines Connection API (ergoConnector.{wallet}.connect()) and
      Context API (ergo.get_utxos(), ergo.sign_tx(), ergo.submit_tx()).
      Implemented by Nautilus and SAFEW. Asynchronous, promise-based.
      All Ergo web dApps use this for wallet interaction.
    category: standard
    docs_url: https://docs.ergoplatform.com/dev/wallet/payments/dApp/

  - term: ErgoPay
    aliases:
      - ergopay
      - EIP-20
      - EIP-0020
      - ergo pay
    definition: >
      Transaction signing protocol for mobile wallets using URI scheme
      (ergopay:<reducedTx>) or dynamic requests (ergopay://<url>).
      Enables desktop dApp → mobile wallet signing flow via QR codes.
      Supports reduced transactions that wallets can verify and sign
      without needing the full dApp context.
    category: standard
    docs_url: https://docs.ergoplatform.com/dev/wallet/payments/ergopay/ergo-pay/

  - term: ErgoAuth
    aliases:
      - ergoauth
      - ergo auth
      - EIP-28
      - EIP-0028
    definition: >
      User authentication protocol via SigmaProp signature. The dApp
      sends a challenge message; the wallet signs it with the user's
      private key without moving any funds. Challenge-response flow
      proves address ownership. Used by Paideia and ErgoPad.
    category: standard
    docs_url: https://docs.ergoplatform.com/dev/wallet/payments/ergoauth/

  - term: EIP-4
    aliases:
      - eip4
      - EIP-0004
      - token standard
      - asset standard
    definition: >
      Standard for token (asset) issuance on Ergo. Defines how token
      metadata (name, description, decimals, content type) is stored
      in registers R4-R9 of the token's minting box.
    category: standard

  - term: EIP-6
    aliases:
      - eip6
      - EIP-0006
      - protocol specification
    definition: >
      Standard format for protocol specifications on Ergo. Used by
      Paideia contracts to formally describe their protocol interactions.
    category: standard

  - term: EIP-22
    aliases:
      - eip22
      - EIP-0022
      - auction contract standard
      - auction house standard
    definition: >
      Auction contract standard for Ergo. Defines the on-chain mechanics
      for timed auctions, buyout options, and bid management. Implemented
      by the Ergo Auction House platform. Auction House V3 extends this
      with fixed-price listings and Dutch auctions.
    category: standard

  - term: EIP-24
    aliases:
      - eip24
      - EIP-0024
      - artwork standard
      - nft artwork standard
      - extended artwork standard
    definition: >
      Extended Assets standard for NFT artwork on Ergo. Defines a
      two-version format: V1 for basic NFT metadata, V2 adding artist
      identity (linked to an issuer box), royalty handling, and detailed
      trait/attribute metadata. Implemented by SkyHarbor and Auction House.
    category: standard

  - term: EIP-31
    aliases:
      - eip31
      - EIP-0031
      - babel fees
      - babel fee
    definition: >
      Babel Fees protocol allowing users to pay transaction fees in tokens
      other than ERG. A liquidity provider places a "babel fee box" offering
      to swap tokens for ERG; the user's transaction references this box
      and pays fees in their preferred token. Fleet SDK includes a plugin.
    category: standard
    docs_url: https://docs.ergoplatform.com/dev/protocol/tx/babel-fees/

  - term: EIP-34
    aliases:
      - eip34
      - EIP-0034
      - nft collections standard
      - collection standard
    definition: >
      NFT Collections standard on Ergo. Defines how NFTs are grouped into
      collections with shared metadata, enabling marketplaces to display
      collection-level information and verify collection membership.
      First adopted by the Ergo Auction House V3.
    category: standard

  - term: EIP-41
    aliases:
      - eip41
      - EIP-0041
      - stealth address standard
    definition: >
      Stealth Addresses standard for Ergo. Defines a protocol for generating
      per-transaction unique addresses derived from a recipient's public key,
      so a blockchain observer cannot link multiple payments to the same
      recipient. Implemented in ErgoMixer and dedicated stealth address tools.
    category: standard


